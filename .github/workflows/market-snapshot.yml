name: Update market snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-snapshot-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch market snapshots
        run: node scripts/update_market_snapshot.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sentiment snapshot dependencies
        run: pip install --quiet requests akshare pandas
      - name: Fetch market sentiment snapshot
        continue-on-error: true
        run: python scripts/update_sentiment_snapshot.py
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A storage/market data/stock_lists/ETF.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market snapshots"
          git pull --rebase origin main
          git push origin main
