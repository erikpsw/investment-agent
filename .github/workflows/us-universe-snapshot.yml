name: Update full US market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14,18,22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-snapshot-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect every directory and quote page, preserving last good snapshot on failure
        run: python scripts/update_us_universe.py
      - name: Commit validated US snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/market_snapshots/us-universe.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update full US market snapshot'
          git pull --rebase origin main
          git push origin main
