name: Update dated CN fallback snapshot

on:
  workflow_dispatch:
  schedule:
    # Shanghai 15:45 and 18:45, after the close. Holidays retain old quotes.
    - cron: "45 7,10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-snapshot-main
  cancel-in-progress: false

jobs:
  update-cn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch and verify original CN quote timestamps
        run: python scripts/refresh_cn_snapshot.py
      - name: Commit verified CN snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/market_snapshots/cn-sina.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh dated CN fallback snapshot"
          git pull --rebase origin main
          git push origin main
