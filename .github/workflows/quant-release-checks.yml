name: Quant release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify scoring endpoint and snapshot recovery
        run: python -m pytest tests/test_formula_ranking_snapshot_recovery.py tests/test_formula_ranking.py tests/test_foreign_live_scanner.py tests/test_cn_live_scanner.py tests/test_screener_snapshot_routing.py tests/test_screener_snapshot_store.py tests/test_formula_stock_detail.py -q
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify release source and score arithmetic
        working-directory: web
        run: npm run test:score-release
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify detail scoring, protection and recovery
        working-directory: web
        run: npx playwright test tests/e2e/score-arithmetic.spec.ts tests/e2e/stock-formula-score.spec.ts --workers=2
      - name: Build production frontend
        working-directory: web
        run: npm run build
